  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #e0a96d;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    /* Cabecera */
    header {
      position: relative;
      text-align: center;
      padding: 60px 20px 20px; /* Margen superior extra para que no choque con el botón */
      border-bottom: 1px solid var(--border);
    }

    /* Botón volver */
    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      transition: 0.2s ease;
      z-index: 20; /* Asegura que el botón siempre quede por encima de todo */
    }

    .back-btn:hover {
      border-color: var(--accent);
      opacity: 0.9;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    /* Pestañas de categorías fijas al hacer scroll */
    nav {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    nav button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s ease;
    }

    nav button.active, nav button:hover {
      background-color: var(--accent);
      color: #121212;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Contenedor del menú */
    main {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px;
    }

    .category-section {
      margin-bottom: 35px;
    }

    .category-title {
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
    }

    .dish-card {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .dish-info {
      flex: 1;
    }

    .dish-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dish-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .dish-price {
      font-weight: bold;
      color: var(--accent);
      font-size: 1.05rem;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 20px;
    }
  </style>
</head>

    const container = document.getElementById("menu-container");

    function renderMenu(filtro = "todos") {
      container.innerHTML = "";

      const categorias = filtro === "todos" 
        ? [...new Set(menuData.map(item => item.categoria))]
        : [filtro];

      categorias.forEach(cat => {
        const platos = menuData.filter(item => item.categoria === cat);
        if (platos.length === 0) return;

        const section = document.createElement("section");
        section.className = "category-section";

        const title = document.createElement("h2");
        title.className = "category-title";
        title.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        section.appendChild(title);

        platos.forEach(plato => {
          const card = document.createElement("div");
          card.className = "dish-card";
          card.innerHTML = `
            <div class="dish-info">
              <div class="dish-name">${plato.nombre}</div>
              <div class="dish-desc">${plato.descripcion}</div>
            </div>
            <div class="dish-price">${plato.precio}</div>
          `;
          section.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll("nav button").forEach(btn => {
        btn.classList.toggle("active", btn.textContent.toLowerCase() === cat || (cat === "todos" && btn.textContent.toLowerCase() === "todos"));
      });
      renderMenu(cat);
    }

    // Carga inicial
    renderMenu();
  </script>
